# docker-compose.services.yml
#
# Legal's always-on dev container: the shared Electric sync service
# (legal-electric). Auth and the hub now live in sertantai-stack's dev compose
# (sertantai-stack/docker/docker-compose.dev.yml, project sertantai-dev;
# Jason 2026-11-21: legal is a local data-assembly app and doesn't own the
# shared stack). Legal's own Postgres is in docker-compose.dev.yml.
#
# First-time setup:  ./scripts/development/sert-up
# After that:        the container auto-restarts on boot (restart: unless-stopped)
#
# Manual:
#   docker compose -f docker-compose.services.yml up -d --no-deps legal-electric
#   docker compose -f docker-compose.services.yml logs -f legal-electric
#
# Never `up --remove-orphans` on this project: the auth and hub containers
# created from it move to project sertantai-dev at the cut-over.

services:
  # ── Electric (shared) ───────────────────────────────────────────────────
  # Shared Electric sync service for legal + compliance frontends.
  # Both services request different shapes from the same instance.
  # Connects to legal's postgres (the shared DB on port 5436).

  legal-electric:
    image: electricsql/electric:latest
    container_name: sertantai-legal-electric
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5436/sertantai_legal_dev
      HTTP_PORT: 3000
      ELECTRIC_INSECURE: "true"
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
