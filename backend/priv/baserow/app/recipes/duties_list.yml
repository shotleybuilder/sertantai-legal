page:
  name: Legal Duties
  path: /legal-duties
  query_params:
    - name: law
      type: text
  visibility: logged-in

data_sources:
  - name: Duties
    type: list_rows
    table: lat
    filters:
      - field: Legal_Register
        type: link_row_contains
        value: "get('page_parameter.law')"
        value_is_formula: true

elements:
  - type: heading
    value: "Legal Duties"
    level: 1

  - type: link
    value: "← Legal Register"
    navigate_to: legal_register

  - type: table
    data_source: Duties
    items_per_page: 25
    filterable: true
    sortable: true
    searchable: true
    css_class: duties-table
    columns:
      - name: Law
        type: text
        field: Legal_Register
        accessor: ".*.value"

      - name: Provision
        type: text
        field: Provision

      - name: Duty Text
        type: text
        field: Provision_Text

      - name: Type
        type: tags
        field: Type

      - name: Actors
        type: tags
        field: Regulated_Actors

      - name: Significance
        type: text
        field: Significance
        accessor: .value

      - name: Details
        type: link
        navigate_to: duty_detail
        params:
          id: "get('current_record.id')"
        link_name: "Details"

    # Per-field filter/sort/search (maps to property_options)
    # Note: link_row and link columns don't support filter
    user_actions:
      - field: Type
        filterable: true
      - field: Significance
        filterable: true
        sortable: true
      - field: Legal_Register
        sortable: true
        searchable: true
      - field: Provision
        searchable: true
      - field: Provision_Text
        searchable: true
      - field: Regulated_Actors
        filterable: true

# CSS applied via Application Settings > Custom Code
# The Builder applies css_class to the table element, then these rules
# are injected into the app's custom CSS.
css: |
  .duties-table .tag-field {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-width: 180px;
  }
  .duties-table .ab-tag {
    white-space: nowrap;
    font-size: 12px;
  }
  /* Duty text: first para only, ellipsis at truncation */
  .duties-table td:nth-child(3) .ab-table__cell-content {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
