page:
  name: Incidents
  path: /incidents
  query_params:
    - name: edit
      type: numeric
  visibility: logged-in

data_sources:
  - name: All Incidents
    type: list_rows
    table: incidents

  - name: Edit Incident
    type: get_row
    table: incidents
    row_id: "get('page_parameter.edit')"

  - name: Personnel
    type: list_rows
    table: personnel

elements:
  - type: heading
    value: "Incident Register"
    level: 1

  - type: button
    value: "+ Report Incident"
    events:
      on_click:
        - type: create_row
          table: incidents
        - type: open_page
          target: _self
          query:
            edit: "Previous action > Create a row > Id"
          manual_config: true

  - type: table
    data_source: All Incidents
    items_per_page: 25
    filterable: true
    sortable: true
    searchable: true
    columns:
      - name: Title
        type: text
        field: Title

      - name: Date
        type: text
        field: Date

      - name: Severity
        type: text
        field: Severity
        accessor: .value

      - name: Status
        type: text
        field: Status
        accessor: .value

      - name: Controls
        type: text
        field: Controls
        accessor: ".*.value"

      - name: Reported By
        type: text
        field: Reported_By
        accessor: ".*.value"

      - name: Edit
        type: link
        navigate_to: _self
        query:
          edit: "get('current_record.id')"
        link_name: "Edit"

    user_actions:
      - field: Severity
        filterable: true
        sortable: true
      - field: Status
        filterable: true
        sortable: true
      - field: Title
        searchable: true

  - type: form_container
    submit_label: "Save Incident"
    manual_nesting: true
    children:
      - type: input_text
        label: Title
        required: true
        default_from: "{Edit Incident}.Title"

      - type: datetime_picker
        label: Date
        default_from: "{Edit Incident}.Date"

      - type: choice
        label: Severity
        options:
          - Critical
          - High
          - Medium
          - Low
        default_from: "{Edit Incident}.Severity.value"

      - type: choice
        label: Status
        options:
          - Open
          - Investigating
          - Resolved
          - Closed
        default_from: "{Edit Incident}.Status.value"

      - type: record_selector
        label: Reported By
        placeholder: "Who reported this?"
        data_source: Personnel

      - type: input_text
        label: Description
        placeholder: "What happened?"
        multiline: true
        default_from: "{Edit Incident}.Description"

      - type: input_text
        label: Root Cause
        placeholder: "Why did it happen?"
        multiline: true
        default_from: "{Edit Incident}.Root_Cause"

workflow:
  on_submit:
    - type: update_row
      table: incidents
      row_id: "page_parameter.edit"
      manual_config: true

    - type: notification
      title: "Incident Saved"
      description: "The incident has been updated."

    - type: refresh_data_source
      target: All Incidents
